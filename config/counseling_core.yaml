# SatsangAI — Counseling Core manifest
#
# The curated subset of the KB used as (a) the default counseling retrieval index
# and (b) the enrichment target. NOT the full corpus, which is overwhelmingly
# Sanskrit narrative (itihasa/Mahabharata/Valmiki) and would flood problem-first
# counseling with narrative verse.
#
# Selection rules:
#   - Home tradition (Swaminarayan / Akshar-Purushottam) in FULL — small + highest value.
#   - Counseling-relevant shared_hindu: Gita, Yoga Sutras, practical niti.
#     Exclude narrative bulk.
#   - Non-scripture front/back matter dropped by RULE, not by id (see below).
#
# ─────────────────────────────────────────────────────────────────────────────
# REWRITTEN 2026-08-01 against the CURRENT corpus. The previous version described
# a corpus that no longer existed: it claimed 231,940 rows and a 17,808-row core,
# and its core tier still listed `upanishads` (1,938) and `subbarao_gita_commentary`
# (380), both deleted from the KB in 2026-07. Because the core resolves by SOURCE
# NAME, a deleted source contributes nothing and raises nothing — so the file read
# as truth while describing a fiction. Every number below was measured.
# ─────────────────────────────────────────────────────────────────────────────
#
# Measured against satsangai/data/parquet/corpus.parquet (2026-08-01): 228,121 rows.
#   Counseling core = 22,838 rows (10.0%).
#   by tradition: swaminarayan 21,605 · shared_hindu 1,233
#   all 22,838 are verified=True (quotable); 22,837 carry the enrichment layer.
#   translation present on only 2,791 rows -> the enricher reads the ORIGINAL for
#     the rest (lang_original: gu 10,780 · en 7,662 · sa 4,396).
#   All 21,605 swaminarayan rows require the gujarati_explanation field.

version: 2
measured_against: satsangai/data/parquet/corpus.parquet
measured_on: 2026-08-01
total_corpus_rows: 228121
core_rows: 22838

# Tier 1 — the default counseling index and the enrichment target.
core:
  # Entire home tradition (by `tradition` column), regardless of source.
  traditions:
    - swaminarayan        # 22,022 rows — Vachanamrut, Swamini Vato, Satsang Diksha,
                          #   Shikshapatri, Kirtan Muktavali, Satsangijivanam,
                          #   Gopalananda Gita Bhashya, Harililamrut, sw_lit_*, etc.
  # Explicit shared_hindu sources (by `source` column).
  sources:
    - bhagavad_gita             # 719 — primary counseling scripture
    - yoga_sutras               # 195 — Patanjali, practical sadhana
    - chanakya_niti             # 319 — practical worldly ethics / niti

# Drop non-scripture front/back matter — tables of contents, glossaries, prefaces,
# indexes, abbreviation lists, publisher's notes, a conference title page — from the
# core. Implemented as a RULE in enrichment/non_scripture.py, evaluated at index
# build time, keying on what the ENRICHMENT says the row is.
#
# It is a rule and not a list because an id list cannot survive a re-chunk. A prior
# audit excluded 14 such chunks by id; the 2026-07 Swaminarayan rebuild changed every
# id and silently unbound 8 of them, putting an IAST romanisation note, a list of
# abbreviations and a conference title page back into the SERVED counseling index.
# Currently drops 417 rows (412 structural, 4 no_help, 1 not_a_teaching).
# Inspect before trusting it:  python -m enrichment.non_scripture --report
# text_type='verse' is exempt so Gita chapter colophons stay addressable for exact
# lookup (verse.is_colophon already keeps them out of verse SEARCH).
exclude_non_scripture: true

# Tier 2 — "widen when thin": pulled in only when Tier 1 retrieval is sparse.
# Devotional/narrative but counseling-usable. NOT enriched, NOT in the index today.
widen_when_thin:
  sources:
    - ramcharitmanas            # 2,247  — devotional moral narrative
    - srimad_bhagavatam         # 12,796 — philosophical purport amid narrative

# Tier 3 — Shastrarth mode only. EMPTY, AND THAT IS THE POINT.
#
# All seven acharya-school sources were removed from the KB in 2026-07 as untrusted
# page-scans with no verse-level citation (satsangai/data/excluded_sources.json).
# All four acharya traditions now hold ZERO rows, so shastrarth cannot be enabled
# from this corpus at all — it is not merely parked behind SATSANG_SHASTRARTH=1, it
# has no data. It was already failing two of its six gates on exactly this material.
# Re-enabling it needs NEW verse-citable sources, not a config change.
shastrarth_breadth:
  sources: []

# Explicitly EXCLUDED from all enrichment/counseling (Sanskrit narrative + Vedic
# ritual bulk). Retrieval-only via the full corpus if ever needed.
excluded_narrative:
  - itihasa
  - mahabharata
  - valmiki_ramayana
  - rigveda
  - yajurveda
  - atharvaveda

# Manual one-off exclusions. Prefer `exclude_non_scripture` above — anything listed
# here is a maintenance liability that stops binding the moment ids change.
# Emptied 2026-08-01: 8 of the 14 previous entries were already dead, and the rule
# covers all 6 that still resolved.
excluded_ids: []
