# One-command deploy of the SatsangAI V1 app.
#
#   source ~/.zshrc            # exports ANTHROPIC_API_KEY
#   docker compose up --build  # -> app on http://localhost:8000  (in-memory store)
#
# That runs the app alone with the default in-memory store (no DB needed). To use
# the Postgres (pgvector) store instead, bring up the "postgres" profile AND set
# SATSANG_STORE=postgres (the app reaches the db service at host "db"):
#
#   SATSANG_STORE=postgres docker compose --profile postgres up --build -d
#   docker compose exec app python -m api.db.load_pg   # one-time: schema + load passages
services:
  app:
    build:
      context: .
    image: satsangai
    ports:
      - "8000:8000"
    environment:
      # Required: generation/planning key. `source ~/.zshrc` before `up`.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY (source ~/.zshrc)}
      SATSANG_STORE: ${SATSANG_STORE:-memory}
      SATSANG_DATABASE_URL: postgresql://postgres:satsang@db:5432/satsang
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    profiles: ["postgres"]
    environment:
      POSTGRES_PASSWORD: satsang
      POSTGRES_DB: satsang
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
